name: JobTrackr CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore JobTrackr.sln

    - name: Build
      run: dotnet build JobTrackr.sln --no-restore --configuration Release

    - name: Run tests
      run: dotnet test JobTrackr.sln --no-build --configuration Release --verbosity normal

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t jobtrackr-api -f src/JobTrackr.API/Dockerfile .

    - name: Docker image built successfully
      run: echo "Docker image built. Add push to registry here when ready."
